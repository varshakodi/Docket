name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A "service container" is a Docker container GitHub starts alongside the
    # job, on the same network. We test against a real PostgreSQL rather than a
    # mock, because the logic under test IS SQL -- mocking it would test nothing.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docket_test
        ports:
          - 5432:5432
        # Don't start the job until Postgres actually answers. Without this the
        # first test races the container's startup and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docket_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI and local can never drift apart.
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Apply migrations
        run: go run ./cmd/docket migrate up

      # -race enables the data race detector. For a concurrency project this is
      # not optional: it catches two goroutines touching the same memory without
      # synchronisation, which is otherwise invisible until production.
      # -p 1 runs packages one at a time. Several packages share the same
      # test database and reset it between tests, so they must not overlap.
      - name: Test
        run: go test -race -p 1 ./...

  # Proves the Docker path works end to end: build the image, start Postgres,
  # migrate, run a worker, enqueue a job, and see it succeed. This is the
  # "clone and run" promise from the README, checked on every push.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and start the stack
        run: docker compose up -d --build

      - name: Enqueue a job (retries until migrations have finished)
        run: |
          for i in $(seq 1 30); do
            if docker compose run --rm --no-deps worker enqueue --queue default --payload '{"sleep_ms":200}'; then
              exit 0
            fi
            sleep 2
          done
          echo "could not enqueue"; docker compose logs; exit 1

      - name: Wait for the worker to finish it
        run: |
          for i in $(seq 1 15); do
            docker compose run --rm --no-deps worker status 1 | tee /tmp/status.txt
            if grep -q succeeded /tmp/status.txt; then exit 0; fi
            sleep 2
          done
          echo "job never succeeded"; docker compose logs; exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
